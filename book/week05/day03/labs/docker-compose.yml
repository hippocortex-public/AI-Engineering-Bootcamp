services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      REDIS_URL: redis://redis:6379/0
      APP_NAME: ai-api
      APP_ENV: dev
    ports:
      - "8000:8000"
    depends_on:
      - redis
