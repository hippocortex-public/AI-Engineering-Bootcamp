services:
  postgres:
    image: postgres:16
    container_name: ai_bootcamp_postgres
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp
      POSTGRES_DB: ai_bootcamp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootcamp -d ai_bootcamp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
